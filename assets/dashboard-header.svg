<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Metrics Dashboard</title>
  <desc id="desc">A dark indigo dashboard banner with an abstract activity chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="10" r="220" fill="#6366f1" opacity=".12"/>
  <circle cx="920" cy="310" r="180" fill="#06b6d4" opacity=".08"/>
  <g opacity=".12" stroke="#fff">
    <path d="M710 55H1145M710 105H1145M710 155H1145M710 205H1145M710 255H1145"/>
    <path d="M750 35V265M850 35V265M950 35V265M1050 35V265M1150 35V265"/>
  </g>
  <path d="M730 224C770 217 790 175 828 181S889 218 925 164 988 107 1022 137 1086 78 1141 91" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#fff">
    <text x="72" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="600" letter-spacing="3" opacity=".7">GITHUB ACTIVITY</text>
    <text x="68" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="48" font-weight="750">Metrics Dashboard</text>
    <text x="72" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" opacity=".72">Code · Collaboration · Delivery · Impact</text>
  </g>
</svg>
